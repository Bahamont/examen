server:
  port: 8081

spring:
  application:
    name: parcel-service-mongo
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/huertos}
  messages:
    basename: messages
    encoding: UTF-8
  jackson:
    deserialization:
      fail-on-unknown-properties: true


logging:
  level:
    com.huertos: INFO
