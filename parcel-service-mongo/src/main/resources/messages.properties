# Validación - Parcel
parcel.name.required=El nombre de la parcela es obligatorio.
parcel.name.size=El nombre de la parcela debe tener entre {min} y {max} caracteres.
parcel.name.pattern=El nombre de la parcela solo puede contener letras, números, espacios y guiones.
parcel.owner.required=El responsable o líder de la parcela es obligatorio.
parcel.owner.size=El responsable debe tener entre {min} y {max} caracteres.
parcel.soilType.required=El tipo de suelo es obligatorio.
parcel.soilType.invalid=El tipo de suelo debe ser ARCILLOSO, LIMOSO o ARENOSO.
parcel.location.required=La ubicación GPS de la parcela es obligatoria.
parcel.location.latitude.required=La latitud es obligatoria.
parcel.location.latitude.range=La latitud debe estar entre -90 y 90.
parcel.location.longitude.required=La longitud es obligatoria.
parcel.location.longitude.range=La longitud debe estar entre -180 y 180.

# Errores de negocio
error.parcel.notFound=No se encontró la parcela con id '{0}'.
error.parcel.duplicateName=Ya existe una parcela registrada con el nombre '{0}'.
error.validation=Los datos enviados no cumplen las reglas de validación.
error.malformedJson=El cuerpo de la solicitud tiene un formato JSON inválido.
error.unsupportedMedia=El tipo de contenido no es compatible. Use application/json.
error.methodNotAllowed=El método HTTP '{0}' no está permitido para este recurso.
error.internal=Ocurrió un error interno al procesar la solicitud.
error.typeMismatch=El valor '{0}' no es válido para el parámetro '{1}'.
