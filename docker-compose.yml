services:
  mongodb:
    image: mongo:7
    container_name: huertos-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: huertos
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: huertos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: huertos
      POSTGRES_USER: huertos
      POSTGRES_PASSWORD: huertos_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huertos -d huertos"]
      interval: 10s
      timeout: 5s
      retries: 5

  parcel-service-mongo:
    build: ./parcel-service-mongo
    container_name: parcel-service-mongo
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/huertos
      SERVER_PORT: 8081
    depends_on:
      mongodb:
        condition: service_healthy

  parcel-service-postgres:
    build: ./parcel-service-postgres
    container_name: parcel-service-postgres
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/huertos
      SPRING_DATASOURCE_USERNAME: huertos
      SPRING_DATASOURCE_PASSWORD: huertos_secret
      SERVER_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mongo_data:
  postgres_data:
